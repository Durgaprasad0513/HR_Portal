name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hr_user
          POSTGRES_PASSWORD: hr_password
          POSTGRES_DB: gate0a
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install Root Dependencies
      run: npm install

    - name: Install Client Dependencies
      run: cd client && npm install

    - name: Install Server Dependencies
      run: cd server && npm install

    - name: Set up Environment
      run: |
        cd server
        cp .env.example .env

    - name: Prisma Generate & Migrate
      run: |
        cd server
        npx prisma generate
        npx prisma migrate deploy
        npm run prisma:seed
        
    - name: Run Root Verify
      run: npm run verify
