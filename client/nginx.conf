server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve the React App and handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api requests to the Node.js backend
    location /api/ {
        proxy_pass http://hr-backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Adjust timeouts for large file uploads if needed
        proxy_read_timeout 90;
        client_max_body_size 50M;
    }

    # Proxy uploaded files (Photos/Documents) if served by backend
    location /uploads/ {
        proxy_pass http://hr-backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
